name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Smoke test
        env:
          SPOTIFY_ENABLED: "false"
        run: |
          node src/server.ts &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8001/health && exit 0
            sleep 0.5
          done
          echo "Server did not become healthy" >&2
          exit 1
